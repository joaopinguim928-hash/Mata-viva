<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Guardiões da Mata Viva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: uma coluna de celular. Medidores fixos no topo, uma paisagem que muda conforme a floresta e o rio, e o cartão da cena logo abaixo. */
:root{
  --bg:#0d2418;
  --panel:#153523;
  --panel-2:#1d4430;
  --line:#2c5a41;
  --ink:#f3ecdc;
  --muted:#a8bda9;
  --urucum:#e4572e;
  --btn:#cf4521;
  --btn-shadow:#8f2e14;
  --leaf:#8fd35f;
  --water:#52b5d1;
  --sun:#f2b24e;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font-family:inherit}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.opt,.btn,.tile,.hot{scroll-margin-top:90px;scroll-margin-bottom:90px}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* Medidores */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 16px 0}
.hud-row{display:flex;gap:10px;align-items:center;padding-bottom:8px}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:1;min-width:0}
.meter{position:relative;min-width:0;--c:var(--leaf)}
.meter[data-k="water"]{--c:var(--water)}
.meter[data-k="village"]{--c:var(--sun)}
.meter.low{--c:var(--urucum)}
.meter-label{display:flex;align-items:center;gap:4px;font-size:.68rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.meter-label svg{width:14px;height:14px;flex:none;fill:currentColor}
.meter-label .val{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:var(--c);transition:width .7s cubic-bezier(.3,.7,.2,1),background .4s}
.delta{position:absolute;right:0;top:-12px;font-weight:800;font-size:.85rem;opacity:0;pointer-events:none;font-variant-numeric:tabular-nums}
.delta.show{animation:delta 1.7s ease-out forwards}
.delta.up{color:var(--leaf)}
.delta.down{color:#ff8f6b}
@keyframes delta{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.jbtn{appearance:none;display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:6px 10px;min-height:44px;font-weight:800;cursor:pointer}
.jbtn svg{width:20px;height:20px;fill:var(--sun)}
.zig{height:6px;background:linear-gradient(135deg,var(--urucum) 25%,transparent 25%) 0 0/12px 12px,linear-gradient(225deg,var(--urucum) 25%,transparent 25%) 0 0/12px 12px}

/* Paisagem */
.land{height:150px;overflow:hidden;background:#123;border-bottom:1px solid var(--line)}
.land svg{display:block;width:100%;height:100%}

/* Palco */
.stage{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;outline:none}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--leaf)}
.prompt{margin:0;font-size:1.1rem;font-weight:700;max-width:60ch}
h1,h2{font-family:var(--font-display);font-weight:800;margin:0;text-wrap:balance}
h1{font-size:clamp(2.3rem,11vw,3.2rem);line-height:.95}
h2{font-size:1.9rem;line-height:1.05}
.chapter{display:flex;flex-direction:column;gap:8px}
.chapter p{margin:0;color:var(--muted);font-size:1.08rem;max-width:56ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.85rem;font-weight:700;color:var(--muted)}
.small{font-size:.82rem;color:var(--muted);margin:0;max-width:60ch}

/* Diálogo */
.say{display:flex;flex-direction:column;gap:12px}
.who{display:flex;align-items:center;gap:12px}
.who svg{width:56px;height:56px;flex:none;border-radius:50%}
.who-name{font-family:var(--font-display);font-weight:800;font-size:1.25rem;line-height:1.1}
.who-role{font-size:.74rem;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:14px 16px;font-size:1.06rem;line-height:1.55;max-width:60ch;animation:rise .35s ease-out}
.nar{color:var(--muted);font-style:italic;font-size:1.08rem;max-width:60ch;animation:rise .35s ease-out}
.nar .tag{display:block;font-style:normal;font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sun);margin-bottom:4px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fact{border:2px dashed var(--sun);border-radius:12px;padding:12px 14px;background:rgba(242,178,78,.09);max-width:60ch}
.fact b{display:block;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--sun);margin-bottom:2px}
.fact p{margin:0}
.event{border:2px solid var(--urucum);border-radius:12px;padding:14px 16px;background:rgba(228,87,46,.14);max-width:60ch}
.event b{display:block;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:#ff9b7a;margin-bottom:2px}
.event p{margin:0;font-size:1.08rem}

/* Botões */
.actions{position:sticky;bottom:env(safe-area-inset-bottom,0px);display:flex;gap:10px;padding:14px 0 6px;margin-top:auto;background:linear-gradient(transparent,var(--bg) 30%)}
.btn{appearance:none;flex:1;border:0;background:var(--btn);color:#fff;font-family:var(--font-display);font-weight:800;font-size:1.2rem;padding:12px 20px;border-radius:14px;min-height:50px;cursor:pointer;box-shadow:0 4px 0 var(--btn-shadow)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--btn-shadow)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.opts{display:grid;gap:10px}
.opt{appearance:none;display:block;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);font-size:1.02rem;font-weight:700;line-height:1.35;min-height:56px;cursor:pointer}
.opt:hover{border-color:var(--leaf)}
.opt strong{display:block;font-family:var(--font-display);font-size:1.15rem;line-height:1.15;margin-bottom:2px}
.opt span{display:block;font-weight:600;color:var(--muted);font-size:.92rem}
.opt[aria-pressed="true"]{border-color:var(--leaf);background:var(--panel-2)}
.opt.right{border-color:var(--leaf);background:#1f5a34}
.opt.wrong{border-color:var(--urucum);background:#4a2318}
.opt:disabled{cursor:default;color:var(--ink)}

/* Exploração */
.explore{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:400/260}
.explore svg{display:block;width:100%;height:100%}
.hot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid #fff;background:rgba(207,69,33,.8);color:#fff;font-family:var(--font-display);font-weight:800;font-size:1.15rem;display:grid;place-items:center;padding:0;cursor:pointer;animation:pulse 1.8s infinite}
.hot.found{background:#2f8a4a;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}100%{box-shadow:0 0 0 16px rgba(255,255,255,0)}}
.pill{align-self:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 14px;font-weight:700;font-size:.92rem}

/* Patrulha */
.pstats{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.timer{height:10px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.timer>i{display:block;height:100%;width:100%;background:var(--sun)}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{appearance:none;position:relative;aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:#1b4e31;padding:4px 4px 12px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.tile svg{width:100%;height:100%;max-width:48px;max-height:48px}
.tile small{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:.6rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.tile[data-s="fire"]{background:#5a2210;border-color:var(--urucum)}
.tile[data-s="cut"]{background:#4a3a10;border-color:var(--sun)}
.tile[data-s="basket"]{background:#3a3220;border-color:#c99a4b}
.tile[data-s="stump"]{background:#33281a;border-color:#4a3a28;opacity:.8}
.tile[data-s="safe"]{background:#164c4e;border-color:var(--water)}
.pmsg{min-height:1.6em;font-weight:700}

/* Caderno */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,15,10,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--panel);width:100%;max-width:560px;max-height:82%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head .btn{flex:none;font-size:1rem;min-height:44px;padding:6px 16px}
.sheet-in .fact{background:rgba(242,178,78,.07)}
.empty{color:var(--muted);margin:0}

/* Final */
.endstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.endstats div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel)}
.endstats b{display:block;font-family:var(--font-display);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.endstats span{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.help ul{margin:6px 0 0;padding-left:1.1em;display:grid;gap:4px}

@media (max-width:440px){.meter-label svg{display:none}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .delta.show{opacity:1}
}
</style>
<div id="app">
  <header class="hud" id="hud" hidden>
    <div class="hud-row">
      <div class="meters">
        <div class="meter" id="m-forest" data-k="forest" role="meter" aria-label="Floresta" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72">
          <div class="meter-label"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7" r="6"/><rect x="9" y="11" width="2" height="8"/></svg>Floresta<span class="val">72</span></div>
          <div class="bar"><i></i></div><span class="delta"></span>
        </div>
        <div class="meter" id="m-water" data-k="water" role="meter" aria-label="Rio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72">
          <div class="meter-label"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1c3 5 6 8 6 11a6 6 0 0 1-12 0c0-3 3-6 6-11z"/></svg>Rio<span class="val">72</span></div>
          <div class="bar"><i></i></div><span class="delta"></span>
        </div>
        <div class="meter" id="m-village" data-k="village" role="meter" aria-label="Aldeia" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60">
          <div class="meter-label"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2l8 8h-2v8H4v-8H2z"/></svg>Aldeia<span class="val">60</span></div>
          <div class="bar"><i></i></div><span class="delta"></span>
        </div>
      </div>
      <button class="jbtn" id="jbtn" type="button" aria-label="Abrir caderno de saberes">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 2h11a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm2 3v2h7V5z"/></svg>
        <b id="jcount">0</b>
      </button>
    </div>
    <div class="zig" aria-hidden="true"></div>
  </header>
  <div class="land" id="land" aria-hidden="true"></div>
  <main class="stage" id="stage" tabindex="-1"></main>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Caderno de saberes">
  <div class="sheet-in">
    <div class="sheet-head">
      <h2>Caderno de saberes</h2>
      <button class="btn ghost" id="sclose" type="button">Fechar</button>
    </div>
    <div id="jlist"></div>
  </div>
</div>
<script>
const CHARS={
  aru:{name:'Aruã',role:'Jovem da aldeia, 15 anos',look:{bg:'#2f7a52',skin:'#b97a4f',hair:'#1b1410',style:'short',cloth:'#d9553a',extra:'necklace'}},
  jaci:{name:'Vovó Jaci',role:'Anciã que conhece as plantas',look:{bg:'#7a5a2e',skin:'#a86a40',hair:'#e8e4dc',style:'bun',cloth:'#2d6a8a',extra:'none'}},
  taina:{name:'Tainá',role:'Comunicadora da aldeia, 17 anos',look:{bg:'#2b6d86',skin:'#c0845a',hair:'#17110d',style:'long',cloth:'#f2b24e',extra:'necklace'}},
  itauba:{name:'Cacique Itaúba',role:'Liderança da aldeia',look:{bg:'#5a3a2a',skin:'#a3623a',hair:'#14100c',style:'short',cloth:'#2f7a52',extra:'band'}},
  marina:{name:'Dra. Marina',role:'Bióloga e pesquisadora',look:{bg:'#4a5c8a',skin:'#e0b08a',hair:'#5a3a22',style:'ponytail',cloth:'#eef2ea',extra:'glasses'}},
  valdo:{name:'Valdo',role:'Intermediário de madeireiros ilegais',look:{bg:'#6b6b5a',skin:'#d9a37a',hair:'#3a2a1c',style:'cap',cloth:'#7b8a5a',extra:'none'}}
};

const FACTS={
  biodiv:{title:'Casa de muita vida',text:'Estima-se que a Amazônia abrigue cerca de 10% das espécies conhecidas do planeta. Cada árvore derrubada é também a casa de muitos seres vivos.'},
  rios:{title:'Rios voadores',text:'A floresta lança vapor de água no ar. Esse vapor forma massas de umidade que viajam e ajudam a levar chuva a outras regiões do Brasil. Uma árvore grande pode liberar centenas de litros de água por dia.'},
  solo:{title:'Raízes seguram a terra',text:'Sem as raízes das árvores, a chuva lava o solo e leva embora os nutrientes. A terra fica fraca e a floresta demora muito para voltar.'},
  barro:{title:'Rio barrento',text:'Quando a terra desce para o rio, a água fica turva. Esse barro, chamado de assoreamento, atrapalha os peixes e piora a água usada pela aldeia.'},
  fauna:{title:'Bichos sem casa',text:'Ao perder as árvores, os animais perdem comida e abrigo. Com menos animais, menos sementes são espalhadas e a floresta tem mais dificuldade de se renovar.'},
  fumaca:{title:'Fumaça e calor',text:'As queimadas soltam gás carbônico (CO₂), que esquenta o planeta, e uma fumaça que faz mal aos pulmões, principalmente de crianças e idosos.'},
  mercurio:{title:'Mercúrio no prato',text:'O garimpo ilegal usa mercúrio, que contamina a água e se acumula nos peixes. Quem come peixe contaminado pode ter problemas de saúde, em especial no sistema nervoso.'},
  satelite:{title:'Olhos no céu',text:'O Inpe acompanha o desmatamento da Amazônia por satélite, com os sistemas Deter (alertas rápidos) e Prodes (taxa anual). Imagens com data e local ajudam a fiscalização a agir.'},
  direitos:{title:'Direito à terra',text:'A Constituição de 1988 reconhece os direitos originários dos povos indígenas sobre as terras que ocupam tradicionalmente. Cabe à União demarcar e proteger essas terras.'},
  preservada:{title:'Floresta em pé',text:'Estudos com imagens de satélite, como os do MapBiomas, mostram que terras indígenas demarcadas estão entre as áreas onde a floresta mais se mantém preservada.'},
  estrada:{title:'Estrada abre porteira',text:'Onde se abre uma estrada, costuma chegar mais gente para desmatar, queimar e invadir. Um corte pequeno pode virar um corte enorme.'},
  sustentavel:{title:'Uso sustentável',text:'Coletar castanha, açaí, frutos e ervas sem derrubar a floresta é uso sustentável. Quem vive da floresta tem interesse em mantê-la viva.'},
  ponto:{title:'Ponto de não retorno',text:'Cientistas alertam que, se o desmatamento e o aquecimento passarem de certo limite, partes da floresta podem perder tantas árvores que deixam de gerar chuva e viram uma vegetação mais seca, parecida com savana.'},
  agro:{title:'Agrofloresta',text:'Plantar alimentos junto com árvores nativas gera renda e mantém a floresta de pé.'},
  ciliar:{title:'Mata ciliar',text:'As árvores nas margens do rio seguram a terra e filtram a água. Replantá-las protege rios e peixes.'}
};

const SIGNS=[
  {id:'solo',x:27,y:75,label:'Árvores cortadas',say:'Aqui havia árvores enormes. Agora só restam troncos, e a terra ficou exposta ao sol e à chuva.',fact:'solo'},
  {id:'barro',x:56,y:83,label:'Riacho barrento',say:'Este riacho sempre foi claro. Hoje a água desce cor de barro, e os peixes sumiram.',fact:'barro'},
  {id:'fauna',x:84,y:47,label:'Ninho vazio',say:'Esta árvore sempre foi cheia de pássaros e macacos. Agora está silenciosa, e o ninho está abandonado.',fact:'fauna'},
  {id:'fumaca',x:86,y:17,label:'Fumaça no horizonte',say:'Uma coluna de fumaça sobe ao longe. Alguém está queimando a mata para abrir terreno.',fact:'fumaca'}
];

const S=(who,text,o={})=>({t:'say',who,text,...o});
const N=(text,o={})=>({t:'nar',text,...o});

const STORY=[
  // Capítulo 1
  {t:'ch',n:1,title:'A floresta fala',sub:'Amanhece na Aldeia Yvy Porã, e algo não está certo.'},
  N('Amanhece na Aldeia Yvy Porã, no coração da Amazônia. Aruã, de 15 anos, sobe a trilha com a avó para colher ervas de remédio.'),
  S('jaci','Respire fundo, meu neto. Sente o cheiro de folha molhada? Aqui tem comida, remédio, água e casa. Tudo isso é a floresta.'),
  S('aru','Vó, como a floresta cuida da gente?'),
  S('jaci','Ela dá o peixe, o fruto, a planta de curar. E dá a chuva também: as árvores soltam água no ar, como rios que ninguém vê.',{fact:'rios'}),
  S('jaci','Cada pedacinho dela é lar de muitos bichos e plantas. Por isso dói tanto quando uma árvore cai sem necessidade.',{fact:'biodiv'}),
  S('jaci','Mas ando preocupada. O rio está mais barrento e o mato, mais quieto. Me ajude a achar os sinais de que algo está errado.'),
  {t:'explore'},
  S('jaci','Você enxergou bem. Quando a floresta dá sinais, é hora de agir.'),
  {t:'event',text:'De longe vem um zumbido que não é de bicho: motosserras. Mais árvores caem.',fx:{forest:-5}},
  {t:'choice',q:'Aruã corre de volta para a aldeia. Quem ele procura primeiro?',opts:[
    {text:'O Cacique Itaúba, para reunir a aldeia',fx:{village:8},say:[
      S('itauba','Fez bem em me avisar, Aruã. Sozinho ninguém segura uma motosserra. Unida, a aldeia tem voz e força.')]},
    {text:'As motosserras, para enfrentar os invasores sozinho',fx:{village:-6},say:[
      S('jaci','Calma, meu neto. Invasores podem ser violentos. Proteger a floresta é tarefa de todos, com apoio das autoridades.'),
      N('Aruã respira fundo e volta para chamar o cacique.')]},
    {text:'Tainá, para registrar tudo com o drone',fx:{village:3},flag:'prova',say:[
      S('taina','Deixa comigo! Imagem com data e local é prova. A fiscalização precisa disso para agir.')]}
  ]},

  // Capítulo 2
  {t:'ch',n:2,title:'Rio barrento',sub:'O drone mostrou o que acontece rio acima.'},
  N('Na beira do rio, Tainá mostra no celular as imagens que o drone gravou.'),
  S('taina','Olha, Aruã. Rio acima tem uma clareira enorme. E duas balsas com bombas sugando o fundo do rio.'),
  S('aru','É garimpo ilegal?'),
  S('taina','Tudo indica que sim. Eles usam mercúrio para separar o ouro. O mercúrio cai na água, entra nos peixes e acaba no nosso prato.',{fact:'mercurio'}),
  {t:'event',text:'A água piora. A aldeia decide parar de pescar até ter certeza de que os peixes estão seguros.',fx:{water:-12}},
  {t:'choice',q:'O que fazer com as imagens do drone?',opts:[

<script>
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rgb=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mix=(c1,c2,t)=>{const a=rgb(c1),b=rgb(c2);return '#'+a.map((v,i)=>Math.round(lerp(v,b[i],t)).toString(16).padStart(2,'0')).join('')};

/* Retratos simples */

  if(style==='short') s+=`<path d="M20 25c0-9 5-13 12-13s12 4 12 13c-3-4-7-6-12-6s-9 2-12 6z" fill="${hair}"/>`;
  if(style==='long') s+=`<path d="M20 26c0-10 5-14 12-14s12 4 12 14c-2-5-6-8-12-8s-10 3-12 8z" fill="${hair}"/>`;
  if(style==='bun') s+=`<path d="${cap}" fill="${hair}"/>`;
  if(style==='ponytail') s+=`<path d="${cap}" fill="${hair}"/><path d="M44 18c6 2 8 10 5 18-1-8-3-12-6-14z" fill="${hair}"/>`;
  if(style==='cap') s+=`<path d="M19 21c1-8 6-11 13-11s12 3 13 11z" fill="#c9462a"/><rect x="19" y="20" width="26" height="4" rx="2" fill="#a83a22"/><rect x="40" y="21" width="12" height="3" rx="1.5" fill="#a83a22"/>`;
  s+=`<circle cx="27.5" cy="28" r="1.6" fill="#1b1410"/><circle cx="36.5" cy="28" r="1.6" fill="#1b1410"/><path d="M27.5 34c2.5 2 6.5 2 9 0" stroke="#1b1410" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;

  return s+'</svg>';
}

/* Paisagem viva: reage aos medidores */
const SLOTS=18;
const REMOVAL=[5,12,1,16,8,3,14,10,0,17,6,13,2,9,15,4,11,7];
const REMOVAL_AT=(()=>{const r=[];REMOVAL.forEach((slot,k)=>r[slot]=k);return r})();

function landscape(forest,water){
  const haze=clamp((75-forest)/75,0,1);
  const mud=clamp((80-water)/80,0,1);
  const alive=Math.round(forest/100*SLOTS);
  const removed=SLOTS-alive;
  const skyTop=mix('#6ec3e6','#c99a62',haze), skyBot=mix('#d6efe9','#e8c391',haze);
  const sun=mix('#ffe29a','#f08a3c',haze);
  const hill=mix('#2f6b45','#6a6f45',haze*.6);
  const ground=mix('#2c6a3e','#6d6a3c',haze*.7);
  const river=mix('#3fa7c9','#9a7a4a',mud);
  const greens=[mix('#2f7d4a','#7a8049',haze*.5),mix('#3c9355','#889050',haze*.5),mix('#287040','#6c7440',haze*.5)];
  let s=`<svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">`;
  s+=`<defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${skyTop}"/><stop offset="1" stop-color="${skyBot}"/></linearGradient></defs>`;
  s+=`<rect width="400" height="150" fill="url(#skyg)"/>`;
  s+=`<circle cx="320" cy="40" r="16" fill="${sun}"/>`;
  s+=`<path d="M0 92Q60 66 130 86T260 80T400 90V120H0Z" fill="${hill}"/>`;
  s+=`<rect y="98" width="400" height="52" fill="${ground}"/>`;
  s+=`<path d="M0 128C90 112 150 140 240 122S360 118 400 124L400 146C330 140 280 150 200 142S60 150 0 146Z" fill="${river}"/>`;
  if(mud<.4) s+=`<path d="M40 134h14M150 132h16M290 128h14" stroke="#fff" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round"/>`;
  // aldeia
  [[326,108],[350,112],[374,108]].forEach(([x,y])=>{
    s+=`<rect x="${x-9}" y="${y-8}" width="18" height="10" fill="#a9744a"/><path d="M${x-12} ${y-7}L${x} ${y-18}L${x+12} ${y-7}Z" fill="#d7b05a"/><rect x="${x-2}" y="${y-5}" width="4" height="7" fill="#5a3a22"/>`;
  });
  // árvores e tocos
  for(let i=0;i<SLOTS;i++){
    const x=14+i*16, y=106+((i*7)%3)*5, k=.85+((i*5)%4)*.08;
    if(REMOVAL_AT[i]>=removed){
      const g=greens[i%3];
      s+=`<rect x="${x-1.5}" y="${y-14}" width="3" height="14" fill="#5b3a22"/>`;
      s+=`<circle cx="${x}" cy="${y-19}" r="${9*k}" fill="${g}"/><circle cx="${x-5}" cy="${y-14}" r="${6*k}" fill="${greens[(i+1)%3]}"/><circle cx="${x+5}" cy="${y-14}" r="${6*k}" fill="${greens[(i+2)%3]}"/>`;
    }else{
      s+=`<ellipse cx="${x}" cy="${y}" rx="9" ry="3" fill="#8a6a42" opacity=".55"/><rect x="${x-2.5}" y="${y-4}" width="5" height="4" fill="#7a5232"/><ellipse cx="${x}" cy="${y-4}" rx="2.5" ry="1" fill="#c79a62"/>`;
    }
  }
  if(forest>=60) s+=`<path d="M60 40q3-3 6 0q3-3 6 0M92 28q3-3 6 0q3-3 6 0M30 24q3-3 6 0q3-3 6 0" stroke="#1a2a20" stroke-width="1.4" fill="none" stroke-linecap="round"/>`;
  if(forest<55){
    const o=(haze*.5).toFixed(2);
    s+=`<ellipse cx="90" cy="70" rx="14" ry="30" fill="#7a6a5a" opacity="${o}"/><ellipse cx="200" cy="64" rx="16" ry="34" fill="#7a6a5a" opacity="${o}"/><ellipse cx="290" cy="72" rx="12" ry="26" fill="#7a6a5a" opacity="${o}"/>`;
  }
  s+=`<rect width="400" height="150" fill="#b8864a" opacity="${(haze*.3).toFixed(2)}"/>`;
  return s+'</svg>';
}

/* Cena de exploração com quatro sinais */
function exploreSVG(){

  });
  // clareira com tocos
  s+=`<ellipse cx="110" cy="205" rx="64" ry="24" fill="#8a6844"/>`;
  [[84,200],[112,212],[138,198],[100,226]].forEach(([x,y])=>{
    s+=`<rect x="${x-8}" y="${y-8}" width="16" height="12" fill="#7a5232"/><ellipse cx="${x}" cy="${y-8}" rx="8" ry="3.4" fill="#c79a62"/><ellipse cx="${x}" cy="${y-8}" rx="4" ry="1.6" fill="none" stroke="#8a6234" stroke-width="1"/>`;
  });
  // riacho barrento
  s+=`<path d="M150 260C170 215 230 200 260 170C280 150 330 150 400 160V176C340 172 300 174 285 192C255 226 215 246 205 260Z" fill="#9a8456" stroke="#6f5a3a" stroke-width="3" stroke-linejoin="round"/>`;
  s+=`<path d="M190 246q10-4 20 0M228 218q10-4 20 0M262 190q10-4 20 0M318 166q10-3 20 0" stroke="#d6e8ec" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".75"/>`;
  // árvore com ninho vazio
  s+=`<rect x="311" y="100" width="18" height="100" fill="#5b3a22"/><circle cx="320" cy="78" r="36" fill="#2f7d4a"/><circle cx="296" cy="96" r="22" fill="#3c9355"/><circle cx="344" cy="96" r="22" fill="#287040"/>`;
  s+=`<ellipse cx="338" cy="122" rx="11" ry="5" fill="#8a6a3a"/><ellipse cx="338" cy="120" rx="7" ry="2.6" fill="#4a3320"/>`;
  return s+'</svg>';
}

const mkBtn=(label,fn,cls)=>{const b=el('button','btn'+(cls?' '+cls:''),label);b.type='button';b.onclick=fn;return b};
const actions=(label,fn)=>{const a=el('div','actions');a.append(mkBtn(label,fn));return a};
const topScroll=()=>{try{window.scrollTo(0,0)}catch(e){}};

/* ---------- Estado e medidores ---------- */
const fresh=()=>({forest:72,water:72,village:60,flags:{},journal:[],quiz:0,i:-1,steps:STORY.slice()});

function setMeters(){
  KEYS.forEach(k=>{
    const m=$('#m-'+k), v=st[k];
    m.querySelector('.bar>i').style.width=v+'%';
    m.querySelector('.val').textContent=v;
    m.setAttribute('aria-valuenow',v);
    m.classList.toggle('low',v<35);
  });
}
function drawLand(){land.innerHTML=landscape(st.forest,st.water)}
function showDelta(k,d){
  const e=$('#m-'+k).querySelector('.delta');
  e.textContent=(d>0?'+':'−')+Math.abs(d);
  e.className='delta '+(d>0?'up':'down');
  void e.offsetWidth;
  e.classList.add('show');
  setTimeout(()=>e.classList.remove('show'),1800);
}
function applyFx(fx){
  KEYS.forEach(k=>{
    if(!fx[k])return;
    const old=st[k];
    st[k]=clamp(old+fx[k],0,100);
    if(st[k]!==old)showDelta(k,st[k]-old);
  });
  setMeters();drawLand();
}

/* ---------- Caderno de saberes ---------- */
function addFact(id){
  if(!st.journal.includes(id)){st.journal.push(id);renderJournal()}
}
function renderJournal(){
  $('#jcount').textContent=st.journal.length;
  const box=$('#jlist');
  box.innerHTML='';
  if(!st.journal.length){box.append(el('p','empty','Ainda está vazio. Descubra saberes durante a jornada e eles aparecem aqui.'));return}
  const wrap=el('div','opts');
  st.journal.forEach(id=>wrap.append(el('div','fact',`<b>${FACTS[id].title}</b><p>${FACTS[id].text}</p>`)));
  box.append(wrap);
}
function openSheet(){sheet.hidden=false;$('#sclose').focus()}
function closeSheet(){sheet.hidden=true;$('#jbtn').focus({preventScroll:true})}
$('#jbtn').onclick=openSheet;
$('#sclose').onclick=closeSheet;
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)closeSheet()});

function factCard(id){
  addFact(id);
  return el('div','fact',`<b>Você descobriu: ${FACTS[id].title}</b><p>${FACTS[id].text}</p>`);
}

/* ---------- Fluxo ---------- */
function insert(arr){st.steps.splice(st.i+1,0,...arr)}
function next(){
  st.i++;
  let s=st.steps[st.i];
  while(s&&s.if&&!st.flags[s.if]){st.i++;s=st.steps[st.i]}
  if(s)show(s);
}
function show(s){
  clearInterval(patrolTimer);
  stage.innerHTML='';
  land.hidden=(s.t==='patrol');
  topScroll();
  ({ch:showCh,nar:showSay,say:showSay,event:showEvent,choice:showChoice,explore:showExplore,patrol:showPatrol,plan:showPlan,quiz:showQuiz,end:showEnd})[s.t](s);
  stage.focus({preventScroll:true});
}

function showTitle(){
  clearInterval(patrolTimer);
  hud.hidden=true;
  land.hidden=false;
  land.innerHTML=landscape(100,100);
  stage.innerHTML='';
  const box=el('div','chapter');
  box.innerHTML=`<div class="eyebrow">Aventura educativa · 9 anos ou mais</div>
    <h1>Guardiões da Mata Viva</h1>
    <p>Você é Aruã, jovem da Aldeia Yvy Porã. O desmatamento ameaça a floresta, o rio e o modo de vida da aldeia. Converse, escolha e vigie a mata para protegê-los.</p>`;
  stage.append(box);
  stage.append(el('div','chips','<span class="chip">5 capítulos</span><span class="chip">cerca de 15 minutos</span><span class="chip">suas escolhas mudam a floresta</span>'));
  stage.append(el('p','small','A aldeia, o povo e os personagens são fictícios, inspirados em situações reais vividas por povos indígenas da Amazônia. Os fatos sobre desmatamento, rios, garimpo e direitos têm base em fontes públicas, como o Inpe, o MapBiomas e a Constituição Federal.'));
  stage.append(actions('Começar a jornada',start));
}
function start(){
  st=fresh();
  hud.hidden=false;
  setMeters();drawLand();renderJournal();
  next();
}

function showCh(s){
  stage.append(el('div','chapter',`<div class="eyebrow">Capítulo ${s.n} de 5</div><h2>${s.title}</h2><p>${s.sub}</p>`));
  stage.append(actions('Vamos',next));
}
function showSay(s){
  const box=el('div','say');
  if(s.t==='say'){
    const c=CHARS[s.who];
    box.append(el('div','who',`${portrait(c.look)}<div><div class="who-name">${c.name}</div><div class="who-role">${c.role}</div></div>`));
    box.append(el('div','bubble',s.text));
  }else{
    box.append(el('div','nar',`<span class="tag">Cena</span>${s.text}`));
  }
  if(s.fx)applyFx(s.fx);
  if(s.fact)box.append(factCard(s.fact));
  stage.append(box,actions('Continuar',next));
}
function showEvent(s){
  stage.append(el('div','event',`<b>Alerta</b><p>${s.text}</p>`));
  if(s.fx)applyFx(s.fx);
  stage.append(actions('Continuar',next));
}
function showChoice(s){
  stage.append(el('p','prompt',s.q));
  const list=el('div','opts');
  s.opts.forEach(o=>{
    const b=el('button','opt',o.text);
    b.type='button';
    b.onclick=()=>{
      if(o.flag)st.flags[o.flag]=1;
      insert(o.say||[]);
      if(o.fx)applyFx(o.fx);
      next();
    };
    list.append(b);
  });
  stage.append(list);
}

/* ---------- Minigame 1: sinais na trilha ---------- */
function showExplore(){
  const found=new Set();
  const wrap=el('div','explore',exploreSVG());
  const count=el('div','pill','Sinais encontrados: <b>0</b> de '+SIGNS.length);
  const info=el('div','say');
  const act=actions('Continuar',next);
  const go=act.querySelector('button');
  go.disabled=true;
  stage.append(el('p','prompt','Toque nos círculos para investigar cada sinal na trilha.'),wrap,count,info,act);
  SIGNS.forEach((g,i)=>{
    const b=el('button','hot',String(i+1));
    b.type='button';
    b.style.left=g.x+'%';b.style.top=g.y+'%';
    b.setAttribute('aria-label','Sinal '+(i+1)+': '+g.label);
    b.onclick=()=>{
      b.classList.add('found');b.textContent='✓';
      found.add(g.id);
      const F=FACTS[g.fact];
      addFact(g.fact);
      info.innerHTML='';
      info.append(el('div','fact',`<b>${g.label}</b><p>${g.say}</p><p><strong>${F.title}.</strong> ${F.text}</p>`));
      count.querySelector('b').textContent=found.size;
      if(found.size===SIGNS.length)go.disabled=false;
    };
    wrap.append(b);
  });
}

/* ---------- Minigame 2: patrulha com drone ---------- */
function showPatrol(){
  const N=16, DUR=30000;
  stage.append(el('p','prompt','Toque em <b>fogo</b> e <b>corte</b> para enviar o alerta. Não toque na <b>coleta</b> das famílias!'));
  const stats=el('div','pstats','<span>Alertas enviados: <b class="v-s">0</b></span><span>Áreas perdidas: <b class="v-l">0</b></span>');
  const timer=el('div','timer','<i></i>');
  const grid=el('div','pgrid');
  const msg=el('div','pmsg','');
  msg.setAttribute('role','status');
  const act=el('div','actions');
  stage.append(stats,timer,grid,msg,act);
  const tiles=[];
  let saved=0,lost=0,wrong=0,t0=0,nextSpawn=0,running=false;

  const paint=i=>{
    const t=tiles[i];
    t.b.dataset.s=t.s;
    t.b.innerHTML=ICON[t.s]+(CAP[t.s]?`<small>${CAP[t.s]}</small>`:'');
    t.b.setAttribute('aria-label',LABEL[t.s]);
  };
  const upd=()=>{
    stats.querySelector('.v-s').textContent=saved;
    stats.querySelector('.v-l').textContent=lost;
  };
  for(let i=0;i<N;i++){
    const b=el('button','tile');
    b.type='button';
    b.onclick=()=>tap(i);
    grid.append(b);
    tiles.push({b,s:'tree',ttl:0});
    paint(i);
  }
  function tap(i){
    if(!running)return;
    const t=tiles[i];
    if(t.s==='fire'||t.s==='cut'){
      saved++;t.s='safe';t.ttl=500;paint(i);msg.textContent='Alerta enviado!';
    }else if(t.s==='basket'){
      wrong++;t.s='tree';paint(i);msg.textContent='Essa é a coleta tradicional das famílias. Não é ameaça!';
    }
    upd();
  }
  function spawn(e){
    const free=[];
    tiles.forEach((t,i)=>{if(t.s==='tree')free.push(i)});
    if(!free.length)return;
    const i=free[Math.floor(Math.random()*free.length)];
    const r=Math.random();
    tiles[i].s=r<.38?'fire':r<.72?'cut':'basket';
    tiles[i].ttl=lerp(2300,1700,e/DUR);
    paint(i);
    nextSpawn+=lerp(950,650,e/DUR);
  }
  function tick(){
    const e=performance.now()-t0;
    tiles.forEach((t,i)=>{
      if(t.s==='fire'||t.s==='cut'||t.s==='basket'||t.s==='safe'){
        t.ttl-=100;
        if(t.ttl<=0){
          if(t.s==='fire'||t.s==='cut'){t.s='stump';lost++}
          else t.s='tree';
          paint(i);
        }
      }
    });
    if(e<DUR-1800&&e>=nextSpawn)spawn(e);
    timer.firstChild.style.width=Math.max(0,100-e/DUR*100)+'%';
    upd();
    if(e>=DUR&&!tiles.some(t=>t.s==='fire'||t.s==='cut'))finish();
  }
  function finish(){
    clearInterval(patrolTimer);running=false;upd();
    const f=clamp(Math.round((saved-lost*2-wrong*.5)/2.5),-10,9);
    const v=wrong>=3?-2:(wrong===0?2:0);
    const rating=f>=5?'great':f>=0?'mid':'poor';
    msg.innerHTML=`<b>Resultado:</b> ${saved} alertas enviados, ${lost} áreas perdidas e ${wrong} toques errados.`;
    act.innerHTML='';
    act.append(mkBtn('Tentar de novo',begin,'ghost'),mkBtn('Continuar',()=>{
      applyFx({forest:f,village:v});
      insert(RESULT[rating]);
      next();
    }));
  }
  function begin(){
    saved=lost=wrong=0;
    tiles.forEach((t,i)=>{t.s='tree';t.ttl=0;paint(i)});
    upd();msg.textContent='Vai! Fique de olho nos focos.';
    act.innerHTML='';
    timer.firstChild.style.width='100%';
    t0=performance.now();nextSpawn=500;running=true;
    clearInterval(patrolTimer);
    patrolTimer=setInterval(tick,100);
  }
  msg.textContent='Pronto? Toque em Iniciar quando quiser.';
  act.append(mkBtn('Iniciar patrulha',begin));
}

/* ---------- Assembleia ---------- */
function showPlan(){
  const sel=new Set();
  const prompt=el('p','prompt','Escolha 3 ações para a aldeia. <b class="cnt">0</b> de 3 escolhidas.');
  const list=el('div','opts');
  const act=actions('Decidir',()=>{
    const out=PLAN.filter(p=>sel.has(p.id)).map(p=>({...p.say,fx:p.fx}));
    insert(out);
    next();
  });
  const go=act.querySelector('button');
  go.disabled=true;
  PLAN.forEach(p=>{
    const b=el('button','opt',`<strong>${p.title}</strong><span>${p.desc}</span>`);
    b.type='button';
    b.setAttribute('aria-pressed','false');
    b.onclick=()=>{
      if(sel.has(p.id))sel.delete(p.id);
      else if(sel.size<3)sel.add(p.id);
      else return;
      b.setAttribute('aria-pressed',String(sel.has(p.id)));
      prompt.querySelector('.cnt').textContent=sel.size;
      go.disabled=sel.size!==3;
    };
    list.append(b);
  });
  stage.append(prompt,list,act);
}

/* ---------- Desafio e final ---------- */
function showQuiz(){
  let qi=0;
  const ask=()=>{
    const Q=QUIZ[qi];
    stage.innerHTML='';
    topScroll();
    stage.append(el('div','eyebrow','Desafio do caderno · '+(qi+1)+' de '+QUIZ.length),el('p','prompt',Q.q));
    const list=el('div','opts');
    Q.o.forEach((t,i)=>{
      const b=el('button','opt',t);
      b.type='button';
      b.onclick=()=>{
        [...list.children].forEach((x,j)=>{x.disabled=true;if(j===Q.a)x.classList.add('right');else if(j===i)x.classList.add('wrong')});
        if(i===Q.a)st.quiz++;
        stage.append(el('div','fact',`<b>${i===Q.a?'Isso mesmo!':'Quase!'}</b><p>${Q.e}</p>`),
          actions(qi<QUIZ.length-1?'Próxima':'Ver o final',()=>{qi++;if(qi<QUIZ.length)ask();else next()}));
      };
      list.append(b);
    });
    stage.append(list);
  };
  ask();
}
function showEnd(){
  const avg=Math.round((st.forest+st.water+st.village)/3);
  const E=ENDINGS[avg>=78?0:avg>=60?1:2];
  stage.append(el('div','chapter',`<div class="eyebrow">Fim da jornada · nota da aldeia ${avg}</div><h2>${E.title}</h2><p>${E.text}</p>`));
  stage.append(el('div','endstats',`<div><b>${st.forest}</b><span>Floresta</span></div><div><b>${st.water}</b><span>Rio</span></div><div><b>${st.village}</b><span>Aldeia</span></div>`));
  stage.append(el('p','prompt',`Você acertou ${st.quiz} de ${QUIZ.length} perguntas do desafio e guardou ${st.journal.length} saberes no caderno.`));
  stage.append(el('div','fact help','<b>Você também pode ajudar</b><ul><li>Converse com sua família e sua escola sobre o que aprendeu.</li><li>Pergunte de onde vêm a madeira, o ouro e a carne que as pessoas compram.</li><li>Plante e cuide de árvores no seu bairro ou na sua escola.</li><li>Conheça a história dos povos indígenas e conte para outras pessoas, com respeito.</li><li>Se souber de desmatamento ilegal, avise um adulto. Denúncias podem ser feitas a órgãos ambientais, como o Ibama.</li></ul>'));
  const act=el('div','actions');
  act.append(mkBtn('Ver caderno',openSheet,'ghost'),mkBtn('Jogar de novo',showTitle));
  stage.append(act);
}

st=fresh();
showTitle();
})();
</script>

</body></html>
